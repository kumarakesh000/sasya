name: Android app

on:
  push:
    branches: [main]
    paths: ["android/**", "index.html", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Bundle the dashboard page and MQTT library into the app
        run: |
          A=android/app/src/main/assets
          mkdir -p $A
          curl -fsSL https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.10.1/mqtt.min.js -o $A/mqtt.min.js
          # Use the bundled copy of mqtt.js instead of the CDN.
          sed -e 's#<script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.10.1/mqtt.min.js"></script>#<script src="mqtt.min.js"></script>#' \
              -e '/unpkg.com\/mqtt/d' index.html > $A/index.html
          grep -q '<script src="mqtt.min.js">' $A/index.html

      - name: Decode signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/sasya.p12"
            echo "KS_FILE=$RUNNER_TEMP/sasya.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_B64 secret; signing with a temporary debug key"
          fi

      - name: Build APK
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          gradle -p android assembleRelease --no-daemon
          cp android/app/build/outputs/apk/release/app-release.apk IrrinovaSoilMonitor.apk

      - uses: actions/upload-artifact@v4
        with:
          name: IrrinovaSoilMonitor-apk
          path: IrrinovaSoilMonitor.apk

      - name: Publish to the "app" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view app >/dev/null 2>&1 || gh release create app --title "Irrinova Soil Monitor Android app" \
            --notes "Latest build of the Irrinova Soil Monitor app. Download IrrinovaSoilMonitor.apk on your phone and install it."
          gh release upload app IrrinovaSoilMonitor.apk --clobber
